<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Tabby รายการหนี้</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600&family=Prompt:wght@500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #FBF6EF; color: #2B2118; font-family: 'Noto Sans Thai', system-ui, sans-serif; display: flex; flex-direction: column;">

  <header style="display: flex; align-items: center; justify-content: space-between; padding: 20px 12px 0 20px;">
    <h1 style="margin: 0; font-family: 'Prompt', 'Noto Sans Thai', sans-serif; font-size: 24px; font-weight: 600; letter-spacing: -0.01em;">Tabby</h1>
    <button type="button" aria-label="ค้นหาชื่อเพื่อน" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: transparent; color: #2B2118; display: flex; align-items: center; justify-content: center; cursor: pointer;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M20 20l-4.2-4.2"></path></svg>
    </button>
  </header>

  <section aria-label="ยอดค้างรวม" style="margin: 16px 20px 0; padding: 20px; border-radius: 24px; background: #2B2118; color: #FBF6EF;">
    <p style="margin: 0; font-size: 14px; color: #E8D9C5;">ยอดค้างรวม</p>
    <p style="margin: 4px 0 0; font-family: 'Prompt', 'Noto Sans Thai', sans-serif; font-size: 40px; font-weight: 600; line-height: 1.2;">฿12,345</p>
    <p style="margin: 8px 0 0; font-size: 14px; color: #E8D9C5;">เพื่อน 7 คน ยังไม่จ่าย 10 รายการ</p>
  </section>

  <div role="group" aria-label="กรองรายการ" style="margin: 16px 20px 0; padding: 4px; border-radius: 26px; background: #F0E7DA; display: flex; gap: 4px;">
    <button type="button" aria-pressed="false" style="flex: 1; min-height: 44px; border: 0; border-radius: 22px; background: transparent; color: #6B5B4B; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer;">ทั้งหมด 15</button>
    <button type="button" aria-pressed="true" style="flex: 1; min-height: 44px; border: 0; border-radius: 22px; background: #FFFFFF; color: #2B2118; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;">ยังไม่จ่าย 10</button>
    <button type="button" aria-pressed="false" style="flex: 1; min-height: 44px; border: 0; border-radius: 22px; background: transparent; color: #6B5B4B; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer;">จ่ายแล้ว 5</button>
  </div>

  <main style="flex: 1; min-height: 0; overflow: hidden; padding: 4px 20px 110px;">
    <sc-for list="{{groups}}" as="group" hint-placeholder-count="3">
      <section style="margin-top: 16px;">
        <h2 style="margin: 0 0 8px 4px; font-size: 14px; font-weight: 600; color: #6B5B4B;">{{group.label}}</h2>
        <ul style="margin: 0; padding: 0; list-style: none; border-radius: 24px; background: #FFFFFF; overflow: hidden;">
          <sc-for list="{{group.rows}}" as="row" hint-placeholder-count="2">
            <li style="display: flex; align-items: center; gap: 12px; min-height: 72px; box-sizing: border-box; padding: 0 12px 0 16px; border-top: {{row.divider}};">
              <span aria-hidden="true" style="flex: none; width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 600; background: {{row.bg}}; color: {{row.fg}};">{{row.initial}}</span>
              <div style="flex: 1; min-width: 0;">
                <p style="margin: 0; font-size: 16px; font-weight: 600; line-height: 1.4;">{{row.name}}</p>
                <p style="margin: 0; font-size: 14px; line-height: 1.4; color: #6B5B4B; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{row.note}}</p>
              </div>
              <p style="margin: 0; flex: none; font-size: 16px; font-weight: 600;">{{row.amount}}</p>
              <button type="button" aria-label="ทำเครื่องหมายว่า {{row.name}} จ่ายแล้ว" style="flex: none; width: 44px; height: 44px; border-radius: 22px; border: 1.5px solid #8C7A66; background: #FFFFFF; color: #8C7A66; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
              </button>
            </li>
          </sc-for>
        </ul>
      </section>
    </sc-for>
  </main>

  <div role="status" style="position: absolute; left: 16px; right: 16px; bottom: 96px; min-height: 52px; box-sizing: border-box; padding: 0 8px 0 16px; border-radius: 16px; background: #2B2118; color: #FBF6EF; display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 14px;">
    <span>ต้น จ่ายแล้ว ฿150</span>
    <button type="button" style="min-height: 44px; padding: 0 12px; border: 0; background: transparent; color: #FFB27A; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;">เลิกทำ</button>
  </div>

  <a href="Tabby-Add.dc.html" style="position: absolute; right: 20px; bottom: 24px; height: 56px; box-sizing: border-box; padding: 0 22px 0 18px; border-radius: 28px; background: {{accent}}; color: #2B2118; display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 600; text-decoration: none;">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
    เพิ่มรายการ
  </a>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#E2762B","options":["#E2762B","#E0A030","#D0584E"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const line = '1px solid #F3EBDF';
    const none = '0 solid transparent';
    return {
      accent: this.props.accent ?? '#E2762B',
      groups: [
        {
          label: 'วันนี้',
          rows: [
            { name: 'ต้น', note: 'ค่าข้าวเที่ยง', amount: '฿180', initial: 'ต', bg: '#FDE3C8', fg: '#7A3A07', divider: none },
            { name: 'แพรว', note: 'ค่าแท็กซี่กลับบ้าน', amount: '฿280', initial: 'พ', bg: '#E3E0F5', fg: '#3B2F82', divider: line }
          ]
        },
        {
          label: 'สัปดาห์นี้',
          rows: [
            { name: 'มีน', note: 'ค่าสุกี้ 4 คน', amount: '฿650', initial: 'ม', bg: '#DDEBDD', fg: '#1F5B36', divider: none },
            { name: 'โอ๊ต', note: 'ตั๋วหนัง 2 ที่นั่ง', amount: '฿420', initial: 'โ', bg: '#F8DCE2', fg: '#8A2142', divider: line },
            { name: 'ฟ้า', note: 'ค่าน้ำมันไปเขาใหญ่', amount: '฿500', initial: 'ฟ', bg: '#FDE3C8', fg: '#7A3A07', divider: line }
          ]
        },
        {
          label: 'เดือนที่แล้ว',
          rows: [
            { name: 'ปุ๊', note: 'ค่าเช่าเครื่องเสียงงานเลี้ยง', amount: '฿1,200', initial: 'ป', bg: '#E3E0F5', fg: '#3B2F82', divider: none }
          ]
        }
      ]
    };
  }
}
</script>
</body>
</html>
