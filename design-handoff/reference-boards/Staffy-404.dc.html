<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Staffy ไม่พบหน้า</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600&family=Prompt:wght@500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 100%; min-height: 900px; box-sizing: border-box; display: flex; background: #F5F6FA; color: #1B2033; font-family: 'Noto Sans Thai', system-ui, sans-serif;">

  <nav aria-label="เมนูหลัก" style="flex: none; width: 240px; box-sizing: border-box; padding: 24px 16px; background: #232A5C; color: #F2F3FA; display: flex; flex-direction: column;">
    <p style="margin: 0 8px 24px; font-family: 'Prompt', 'Noto Sans Thai', sans-serif; font-size: 24px; font-weight: 600;">Staffy</p>
    <sc-for list="{{menu}}" as="m" hint-placeholder-count="6">
      <a href="{{m.href}}" aria-current="{{m.current}}" style="min-height: 44px; box-sizing: border-box; padding: 0 12px; margin-bottom: 4px; border-radius: 10px; display: flex; align-items: center; justify-content: space-between; text-decoration: none; font-size: 16px; font-weight: {{m.weight}}; background: {{m.bg}}; color: {{m.fg}};">
        {{m.label}}
        <span style="font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 10px; background: #B3261E; color: #FFFFFF; display: {{m.badgeShow}};">{{m.badge}}</span>
      </a>
    </sc-for>
    <div style="margin-top: auto; padding: 12px; border-top: 1px solid #3A4278;">
      <p style="margin: 0; font-size: 14px; font-weight: 600;">สมหญิง ใจดี</p>
      <p style="margin: 2px 0 8px; font-size: 14px; color: #C9CDE8;">HR</p>
      <a href="Staffy-Account.dc.html" style="min-height: 44px; display: flex; align-items: center; font-size: 14px; color: #E4E6F6;">บัญชีของฉัน</a>
      <a href="Staffy-Login.dc.html" style="min-height: 44px; display: flex; align-items: center; font-size: 14px; color: #E4E6F6;">ออกจากระบบ</a>
    </div>
  </nav>

  <main style="flex: 1; min-width: 0; padding: 32px 40px; box-sizing: border-box; display: flex; align-items: center; justify-content: center;">
    <div style="width: 100%; max-width: 460px; text-align: center;">
      <p style="margin: 0; font-family: 'Prompt', 'Noto Sans Thai', sans-serif; font-size: 72px; font-weight: 600; line-height: 1; color: #3B4BC4;">404</p>
      <h1 style="margin: 16px 0 0; font-family: 'Prompt', 'Noto Sans Thai', sans-serif; font-size: 28px; font-weight: 600;">ไม่พบหน้าที่ต้องการ</h1>
      <p style="margin: 12px 0 0; font-size: 16px; line-height: 1.7; color: #4F566E;">ลิงก์อาจผิด หรือพนักงานคนนั้นถูกลบออกจากระบบแล้ว ลองค้นหาชื่อหรือรหัสพนักงานแทนได้</p>

      <form method="get" action="/employees" style="margin-top: 24px; display: flex; gap: 8px; text-align: left;">
        <label for="q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">ค้นหาพนักงาน</label>
        <input id="q" name="q" type="search" placeholder="ชื่อ รหัสพนักงาน หรืออีเมล" style="flex: 1; min-width: 0; box-sizing: border-box; height: 48px; padding: 0 14px; border: 1.5px solid #C5CADB; border-radius: 10px; background: #FFFFFF; font-family: inherit; font-size: 16px; color: #1B2033;">
        <button type="submit" style="min-height: 48px; padding: 0 22px; border: 0; border-radius: 10px; background: #3B4BC4; color: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer;">ค้นหา</button>
      </form>

      <div style="margin-top: 20px; display: flex; gap: 4px; justify-content: center; flex-wrap: wrap;">
        <a href="Staffy-Dashboard.dc.html" style="min-height: 44px; padding: 0 14px; display: flex; align-items: center; color: #3B4BC4; font-size: 14px; font-weight: 600; text-decoration: none;">แดชบอร์ด</a>
        <a href="Staffy-Employees.dc.html" style="min-height: 44px; padding: 0 14px; display: flex; align-items: center; color: #3B4BC4; font-size: 14px; font-weight: 600; text-decoration: none;">รายการพนักงาน</a>
        <a href="Staffy-Leaves.dc.html" style="min-height: 44px; padding: 0 14px; display: flex; align-items: center; color: #3B4BC4; font-size: 14px; font-weight: 600; text-decoration: none;">การลา</a>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const items = [
      ['แดชบอร์ด', 'Staffy-Dashboard.dc.html'], ['พนักงาน', 'Staffy-Employees.dc.html'], ['การลา', 'Staffy-Leaves.dc.html'],
      ['บัญชีผู้ใช้', 'Staffy-Users.dc.html'], ['บันทึกการใช้งาน', 'Staffy-Audit.dc.html'], ['สถานะระบบ', 'Staffy-Status.dc.html'], ['แผนก', 'Staffy-Departments.dc.html'], ['ข้อมูลบริษัท', 'Staffy-Company.dc.html']
    ];
    const cur = -1;
    const menu = items.map(([label, href], i) => ({
      label, href,
      current: i === cur ? 'page' : 'false',
      weight: i === cur ? 600 : 500,
      bg: i === cur ? '#3B4BC4' : 'transparent',
      fg: i === cur ? '#FFFFFF' : '#E4E6F6',
      badge: '4',
      badgeShow: label === 'การลา' && i !== cur ? 'inline-block' : 'none'
    }));
    return { menu };
  }
}
</script>
</body>
</html>
