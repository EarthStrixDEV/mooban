<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Mooban ทดสอบระบบ</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600&family=Prompt:wght@500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
:root{--bg:#F3F6F1;--card:#FFFFFF;--ink:#17261D;--sub:#55665B;--line:#E1E8DF;--brand:#1F7A4D;--brandsoft:#DDEFE4;--chip:#E9EFE7;--onbrand:#FFFFFF}
@media (prefers-color-scheme: dark){:root{--bg:#0F1712;--card:#18231C;--ink:#EAF2EC;--sub:#A6B8AB;--line:#263329;--brand:#5CC48D;--brandsoft:#1E3A2B;--chip:#202D24;--onbrand:#0F1712}}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: var(--bg); color: var(--ink); font-family: 'Noto Sans Thai', system-ui, sans-serif; display: flex; flex-direction: column;">

  <header style="display: flex; align-items: center; gap: 4px; padding: 16px 12px 0 8px;">
    <a href="Mooban-Feed.dc.html" aria-label="กลับไปฟีด" style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; color: var(--ink); text-decoration: none;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <h1 style="margin: 0; font-family: 'Prompt', 'Noto Sans Thai', sans-serif; font-size: 20px; font-weight: 600;">ทดสอบระบบ</h1>
  </header>

  <main style="flex: 1; min-height: 0; overflow: hidden; padding: 8px 16px 16px; display: flex; flex-direction: column; gap: 12px;">

    <section aria-labelledby="t-up" style="padding: 14px 16px; border-radius: 20px; background: var(--card); border: 1px solid var(--line);">
      <h2 id="t-up" style="margin: 0; font-size: 16px; font-weight: 600;">1. อัปโหลดรูป</h2>
      <div style="margin-top: 10px; display: flex; align-items: center; gap: 12px;">
        <label for="file" style="flex: none; min-height: 44px; box-sizing: border-box; padding: 0 18px; border-radius: 22px; background: var(--brand); color: var(--onbrand); display: flex; align-items: center; font-size: 14px; font-weight: 600; cursor: pointer;">เลือกรูป</label>
        <input id="file" type="file" accept="image/*" style="position: absolute; width: 1px; height: 1px; opacity: 0;">
        <p style="margin: 0; min-width: 0; font-size: 14px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">longan.jpg · 3.2 MB</p>
      </div>
      <dl style="margin: 10px 0 0; font-size: 14px;">
        <sc-for list="{{upload}}" as="u" hint-placeholder-count="5">
          <div style="display: flex; justify-content: space-between; align-items: center; min-height: 30px; border-top: 1px solid var(--line);">
            <dt style="color: var(--sub);">{{u.k}}</dt>
            <dd style="margin: 0; font-weight: 600; color: {{u.color}};">{{u.v}}</dd>
          </div>
        </sc-for>
      </dl>
    </section>

    <section aria-labelledby="t-rt" style="padding: 14px 16px; border-radius: 20px; background: var(--card); border: 1px solid var(--line);">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <h2 id="t-rt" style="margin: 0; font-size: 16px; font-weight: 600;">2. ความหน่วง Realtime (SSE)</h2>
        <button type="button" style="min-height: 44px; padding: 0 16px; border: 0; border-radius: 22px; background: var(--brand); color: var(--onbrand); font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;">เริ่มทดสอบ</button>
      </div>
      <div style="display: flex; gap: 8px; margin-top: 8px;">
        <sc-for list="{{rt}}" as="m" hint-placeholder-count="3">
          <div style="flex: 1; padding: 8px; border-radius: 12px; background: var(--bg); text-align: center;">
            <p style="margin: 0; font-size: 14px; color: var(--sub);">{{m.k}}</p>
            <p style="margin: 0; font-family: 'Prompt', 'Noto Sans Thai', sans-serif; font-size: 20px; font-weight: 600;">{{m.v}}<span style="font-size: 14px; font-weight: 500; color: var(--sub);"> ms</span></p>
          </div>
        </sc-for>
      </div>
      <svg viewBox="0 0 340 56" width="100%" role="img" aria-label="กราฟความหน่วงของ 30 ข้อความล่าสุด" style="display: block; margin-top: 10px;">
        <line x1="0" y1="55" x2="340" y2="55" style="stroke: var(--line);" stroke-width="1"></line>
        <polyline points="{{spark}}" fill="none" style="stroke: var(--brand);" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></polyline>
      </svg>
    </section>

    <section aria-labelledby="t-ws" style="padding: 14px 16px; border-radius: 20px; background: var(--card); border: 1px solid var(--line);">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <h2 id="t-ws" style="margin: 0; font-size: 16px; font-weight: 600;">3. WebSocket RTT</h2>
        <p role="status" style="margin: 0; padding: 4px 12px; border-radius: 14px; background: var(--brandsoft); color: var(--ink); font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px;">
          <span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 4px; background: var(--brand);"></span>
          เชื่อมต่อแล้ว
        </p>
      </div>
      <p style="margin: 8px 0 0; font-size: 14px; color: var(--sub);">RTT ล่าสุด <strong style="color: var(--ink);">31 ms</strong> · เฉลี่ย 36 ms จาก 20 ครั้ง</p>
      <div style="display: flex; gap: 8px; margin-top: 8px;">
        <button type="button" style="flex: 1; min-height: 44px; border: 0; border-radius: 22px; background: var(--brand); color: var(--onbrand); font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;">ส่ง ping</button>
        <button type="button" style="flex: 1; min-height: 44px; border: 1.5px solid var(--brand); border-radius: 22px; background: transparent; color: var(--ink); font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;">ตัดการเชื่อมต่อ</button>
      </div>
    </section>

  </main>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const samples = [44,41,52,38,47,61,43,40,39,55,118,46,42,37,41,49,45,43,40,58,44,41,39,47,52,42,40,45,43,41];
    const spark = samples.map((v, i) => {
      const x = 4 + i * (332 / (samples.length - 1));
      const y = 52 - Math.min(v, 130) / 130 * 48;
      return x.toFixed(1) + ',' + y.toFixed(1);
    }).join(' ');
    return {
      upload: [
        { k: 'ประมวลผล (processing_ms)', v: '184 ms', color: 'var(--ink)' },
        { k: 'รูปแบบที่ได้ (format)', v: 'image/webp', color: 'var(--ink)' },
        { k: 'ต้นฉบับ', v: '3.2 MB', color: 'var(--ink)' },
        { k: 'Thumbnail JPEG → WebP', v: '112 KB → 86 KB', color: 'var(--ink)' },
        { k: 'ประหยัดจาก WebP', v: '23%', color: 'var(--brand)' }
      ],
      rt: [
        { k: 'เฉลี่ย', v: 47 },
        { k: 'p50', v: 43 },
        { k: 'p95', v: 118 }
      ],
      spark
    };
  }
}
</script>
</body>
</html>
