<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Mooban แกลเลอรี</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600&family=Prompt:wght@500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
:root{--bg:#F3F6F1;--card:#FFFFFF;--ink:#17261D;--sub:#55665B;--line:#E1E8DF;--brand:#1F7A4D;--brandsoft:#DDEFE4;--chip:#E9EFE7;--onbrand:#FFFFFF}
@media (prefers-color-scheme: dark){:root{--bg:#0F1712;--card:#18231C;--ink:#EAF2EC;--sub:#A6B8AB;--line:#263329;--brand:#5CC48D;--brandsoft:#1E3A2B;--chip:#202D24;--onbrand:#0F1712}}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: var(--bg); color: var(--ink); font-family: 'Noto Sans Thai', system-ui, sans-serif; display: flex; flex-direction: column;">

  <header style="padding: 16px 20px 0;">
    <h1 style="margin: 0; font-family: 'Prompt', 'Noto Sans Thai', sans-serif; font-size: 22px; font-weight: 600;">แกลเลอรี</h1>
    <p style="margin: 4px 0 0; font-size: 14px; color: var(--sub);">รูปจากทุกคนในหมู่บ้าน 128 รูป</p>
  </header>

  <div role="group" aria-label="เรียงรูป" style="display: flex; gap: 8px; padding: 12px 20px 0;">
    <button type="button" aria-pressed="true" style="min-height: 44px; padding: 0 18px; border: 0; border-radius: 22px; background: var(--brand); color: var(--onbrand); font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;">ล่าสุด</button>
    <button type="button" aria-pressed="false" style="min-height: 44px; padding: 0 18px; border: 0; border-radius: 22px; background: var(--chip); color: var(--ink); font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer;">ถูกใจมากสุด</button>
    <button type="button" aria-pressed="false" style="min-height: 44px; padding: 0 18px; border: 0; border-radius: 22px; background: var(--chip); color: var(--ink); font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer;">ของฉัน</button>
  </div>

  <main style="flex: 1; min-height: 0; overflow: hidden; padding: 12px 16px 90px; display: flex; gap: 8px;">
    <sc-for list="{{cols}}" as="col" hint-placeholder-count="2">
      <ul style="flex: 1; min-width: 0; margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px;">
        <sc-for list="{{col}}" as="t" hint-placeholder-count="3">
          <li style="position: relative; border-radius: 16px; overflow: hidden; aspect-ratio: {{t.ratio}}; background: {{t.bg}};">
            <button type="button" aria-label="เปิดรูป {{t.alt}}" style="position: absolute; inset: 0; width: 100%; height: 100%; border: 0; padding: 0; background: transparent; cursor: pointer;"></button>
            <span style="position: absolute; left: 8px; bottom: 8px; padding: 2px 10px; border-radius: 12px; background: rgba(0,0,0,0.62); color: #FFFFFF; font-size: 12px; font-weight: 500; pointer-events: none;">@{{t.by}}</span>
          </li>
        </sc-for>
      </ul>
    </sc-for>
  </main>

  <nav aria-label="เมนูหลัก" style="position: absolute; left: 0; right: 0; bottom: 0; height: 72px; box-sizing: border-box; padding-bottom: 8px; display: flex; background: var(--card); border-top: 1px solid var(--line);">
    <a href="Mooban-Feed.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--sub); font-size: 12px; font-weight: 500; text-decoration: none;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-6.5 8 6.5v8a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"></path></svg>
      ฟีด
    </a>
    <a href="Mooban-Gallery.dc.html" aria-current="page" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--brand); font-size: 12px; font-weight: 600; text-decoration: none;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="3"></rect><circle cx="9" cy="10" r="1.6"></circle><path d="M4 17l5-4.5 4 3.5 3-2.5 4 3.5"></path></svg>
      แกลเลอรี
    </a>
    <a href="Mooban-Feed.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--sub); font-size: 12px; font-weight: 500; text-decoration: none;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8.5" r="3.5"></circle><path d="M5 20c.8-3.6 3.5-5.5 7-5.5s6.2 1.9 7 5.5"></path></svg>
      โปรไฟล์
    </a>
  </nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      cols: [
        [
          { ratio: '4 / 5', bg: 'linear-gradient(160deg,#E4B363,#B5651D)', by: 'pa_noi', alt: 'มะม่วงที่ตลาด' },
          { ratio: '1 / 1', bg: 'linear-gradient(160deg,#7FB77E,#2F6B3A)', by: 'somchai', alt: 'ต้นไม้หน้าบ้าน' },
          { ratio: '3 / 4', bg: 'linear-gradient(160deg,#9CB4D8,#3E5C8A)', by: 'lungek', alt: 'ท้องฟ้าตอนเย็น' }
        ],
        [
          { ratio: '1 / 1', bg: 'linear-gradient(160deg,#E9A6A1,#A8403B)', by: 'nong', alt: 'ดอกไม้ในสวน' },
          { ratio: '3 / 4', bg: 'linear-gradient(160deg,#C9B8E6,#6A4FA8)', by: 'somchai', alt: 'งานวัดวันเสาร์' },
          { ratio: '4 / 5', bg: 'linear-gradient(160deg,#F1D27A,#B88A12)', by: 'pa_noi', alt: 'ข้าวเหนียวมะม่วง' }
        ]
      ]
    };
  }
}
</script>
</body>
</html>
