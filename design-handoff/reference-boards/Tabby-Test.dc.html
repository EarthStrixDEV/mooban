<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Tabby ทดสอบระบบ</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600&family=Prompt:wght@500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #FBF6EF; color: #2B2118; font-family: 'Noto Sans Thai', system-ui, sans-serif; display: flex; flex-direction: column;">

  <header style="display: flex; align-items: center; gap: 4px; padding: 20px 12px 0 8px;">
    <a href="Main.dc.html" aria-label="กลับไปรายการหนี้" style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; color: #2B2118; text-decoration: none;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <h1 style="margin: 0; font-family: 'Prompt', 'Noto Sans Thai', sans-serif; font-size: 22px; font-weight: 600;">ทดสอบระบบ</h1>
  </header>

  <main style="flex: 1; min-height: 0; overflow-y: auto; padding: 16px 20px 32px; display: flex; flex-direction: column; gap: 16px;">

    <section aria-labelledby="bw" style="padding: 20px; border-radius: 24px; background: #FFFFFF;">
      <h2 id="bw" style="margin: 0; font-size: 16px; font-weight: 600;">Bandwidth</h2>
      <label for="size" style="display: block; margin: 16px 0 8px; font-size: 14px; font-weight: 600;">ขนาดไฟล์ดาวน์โหลด</label>
      <select id="size" style="width: 100%; box-sizing: border-box; height: 48px; padding: 0 14px; border: 1.5px solid #D9CBB6; border-radius: 14px; background: #FFFFFF; color: #2B2118; font-family: inherit; font-size: 16px;">
        <option>1 MB</option><option selected>10 MB</option><option>50 MB</option>
      </select>
      <div style="margin-top: 16px; display: flex; align-items: baseline; gap: 8px;">
        <p style="margin: 0; font-family: 'Prompt', 'Noto Sans Thai', sans-serif; font-size: 44px; font-weight: 600; line-height: 1.1;">48.2</p>
        <p style="margin: 0; font-size: 16px; color: #6B5B4B;">Mbps ดาวน์โหลด</p>
      </div>
      <div role="progressbar" aria-label="ความคืบหน้าดาวน์โหลด" aria-valuemin="0" aria-valuemax="100" aria-valuenow="64" style="margin-top: 12px; height: 10px; border-radius: 5px; background: #F0E7DA; overflow: hidden;">
        <div style="width: 64%; height: 100%; background: {{accent}};"></div>
      </div>
      <p style="margin: 8px 0 0; font-size: 14px; color: #6B5B4B;">อัปโหลดล่าสุด 21.7 Mbps</p>
      <div style="display: flex; gap: 8px; margin-top: 16px;">
        <button type="button" style="flex: 1; height: 48px; border: 0; border-radius: 24px; background: {{accent}}; color: #2B2118; font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer;">เริ่มดาวน์โหลด</button>
        <button type="button" style="flex: 1; height: 48px; border: 0; border-radius: 24px; background: #F0E7DA; color: #2B2118; font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer;">ทดสอบอัปโหลด</button>
      </div>
    </section>

    <section aria-labelledby="ch" style="padding: 20px; border-radius: 24px; background: #FFFFFF;">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <h2 id="ch" style="margin: 0; font-size: 16px; font-weight: 600;">Caching</h2>
        <button type="button" style="min-height: 44px; padding: 0 16px; border: 0; border-radius: 22px; background: #F0E7DA; color: #2B2118; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;">ตรวจใหม่</button>
      </div>
      <ul style="margin: 8px 0 0; padding: 0; list-style: none;">
        <sc-for list="{{checks}}" as="c" hint-placeholder-count="4">
          <li style="display: flex; align-items: center; gap: 12px; min-height: 52px; border-top: {{c.divider}};">
            <span style="flex: none; min-width: 52px; box-sizing: border-box; text-align: center; padding: 2px 8px; border-radius: 12px; font-size: 14px; font-weight: 600; background: {{c.bg}}; color: {{c.fg}};">{{c.result}}</span>
            <div style="flex: 1; min-width: 0;">
              <p style="margin: 0; font-size: 14px; font-weight: 600;">{{c.name}}</p>
              <p style="margin: 0; font-size: 14px; color: #6B5B4B;">{{c.detail}}</p>
            </div>
          </li>
        </sc-for>
      </ul>
    </section>

    <section aria-labelledby="api" style="padding: 20px; border-radius: 24px; background: #FFFFFF;">
      <h2 id="api" style="margin: 0; font-size: 16px; font-weight: 600;">API Request</h2>
      <div style="display: flex; gap: 12px; margin-top: 16px;">
        <div style="flex: 1;">
          <label for="reqs" style="display: block; margin-bottom: 8px; font-size: 14px; font-weight: 600;">จำนวนคำขอ</label>
          <input id="reqs" type="text" inputmode="numeric" value="200" style="width: 100%; box-sizing: border-box; height: 48px; padding: 0 14px; border: 1.5px solid #D9CBB6; border-radius: 14px; background: #FFFFFF; color: #2B2118; font-family: inherit; font-size: 16px;">
        </div>
        <div style="flex: 1;">
          <label for="conc" style="display: block; margin-bottom: 8px; font-size: 14px; font-weight: 600;">พร้อมกัน</label>
          <input id="conc" type="text" inputmode="numeric" value="10" style="width: 100%; box-sizing: border-box; height: 48px; padding: 0 14px; border: 1.5px solid #D9CBB6; border-radius: 14px; background: #FFFFFF; color: #2B2118; font-family: inherit; font-size: 16px;">
        </div>
      </div>
      <button type="button" style="margin-top: 16px; width: 100%; height: 48px; border: 0; border-radius: 24px; background: {{accent}}; color: #2B2118; font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer;">เริ่มทดสอบ</button>

      <dl style="margin: 20px 0 0; display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
        <sc-for list="{{stats}}" as="s" hint-placeholder-count="4">
          <div style="padding: 12px 16px; border-radius: 16px; background: #FBF6EF;">
            <dt style="font-size: 14px; color: #6B5B4B;">{{s.label}}</dt>
            <dd style="margin: 2px 0 0; font-family: 'Prompt', 'Noto Sans Thai', sans-serif; font-size: 22px; font-weight: 600;">{{s.value}}</dd>
          </div>
        </sc-for>
      </dl>

      <p style="margin: 20px 0 8px; font-size: 14px; font-weight: 600;">การกระจายเวลาตอบสนอง (มิลลิวินาที)</p>
      <div role="img" aria-label="กราฟแท่งการกระจายเวลาตอบสนอง ส่วนใหญ่อยู่ที่ 20 ถึง 40 มิลลิวินาที" style="height: 110px; display: flex; align-items: flex-end; gap: 6px;">
        <sc-for list="{{bars}}" as="b" hint-placeholder-count="8">
          <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%;">
            <div style="width: 100%; height: {{b.h}}px; border-radius: 6px 6px 0 0; background: {{b.color}};"></div>
          </div>
        </sc-for>
      </div>
      <div style="display: flex; justify-content: space-between; margin-top: 4px; font-size: 12px; color: #6B5B4B;"><span>0</span><span>50</span><span>100+</span></div>
    </section>

  </main>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#E2762B","options":["#E2762B","#E0A030","#D0584E"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const line = '1px solid #F3EBDF';
    const none = '0 solid transparent';
    const ok = { result: 'ผ่าน', bg: '#DDEBDD', fg: '#1F5B36' };
    const bad = { result: 'ไม่ผ่าน', bg: '#FDECEA', fg: '#8E1B12' };
    const hs = [14, 38, 76, 98, 62, 34, 18, 8];
    return {
      accent: this.props.accent ?? '#E2762B',
      checks: [
        { name: 'ETag', detail: 'พบ "a1b2c3" ในคำตอบ', divider: none, ...ok },
        { name: 'Cache-Control', detail: 'public, max-age=3600', divider: line, ...ok },
        { name: 'ส่งซ้ำด้วย If-None-Match', detail: 'ได้ 304 Not Modified', divider: line, ...ok },
        { name: 'ไฟล์ static (CSS/JS)', detail: 'ไม่มี Expires หรือ max-age', divider: line, ...bad }
      ],
      stats: [
        { label: 'เฉลี่ย', value: '31 ms' },
        { label: 'มัธยฐาน', value: '27 ms' },
        { label: 'p95', value: '74 ms' },
        { label: 'อัตราผิดพลาด', value: '0.5%' }
      ],
      bars: hs.map((h, i) => ({ h, color: i === 6 || i === 7 ? '#D0584E' : '#E2762B' }))
    };
  }
}
</script>
</body>
</html>
