<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Mooban โพสต์ใหม่</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600&family=Prompt:wght@500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
:root{--bg:#F3F6F1;--card:#FFFFFF;--ink:#17261D;--sub:#55665B;--line:#E1E8DF;--brand:#1F7A4D;--brandsoft:#DDEFE4;--chip:#E9EFE7;--onbrand:#FFFFFF}
@media (prefers-color-scheme: dark){:root{--bg:#0F1712;--card:#18231C;--ink:#EAF2EC;--sub:#A6B8AB;--line:#263329;--brand:#5CC48D;--brandsoft:#1E3A2B;--chip:#202D24;--onbrand:#0F1712}}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: var(--bg); color: var(--ink); font-family: 'Noto Sans Thai', system-ui, sans-serif; display: flex; flex-direction: column;">

  <header style="display: flex; align-items: center; justify-content: space-between; padding: 16px 16px 8px 8px;">
    <a href="Mooban-Feed.dc.html" style="min-height: 44px; padding: 0 12px; display: flex; align-items: center; color: var(--sub); font-size: 16px; font-weight: 500; text-decoration: none;">ยกเลิก</a>
    <button type="submit" style="min-height: 44px; padding: 0 22px; border: 0; border-radius: 22px; background: var(--brand); color: var(--onbrand); font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer;">โพสต์</button>
  </header>

  <form style="flex: 1; min-height: 0; overflow: hidden; padding: 8px 20px 0;">
    <div style="display: flex; gap: 12px;">
      <span aria-hidden="true" style="flex: none; width: 40px; height: 40px; border-radius: 20px; background: var(--brandsoft); color: var(--brand); display: flex; align-items: center; justify-content: center; font-weight: 600;">ฉ</span>
      <div style="flex: 1; min-width: 0;">
        <label for="body" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">ข้อความโพสต์</label>
        <textarea id="body" name="body" rows="4" maxlength="280" style="width: 100%; box-sizing: border-box; min-height: 110px; padding: 8px 0; border: 0; outline: 0; resize: none; background: transparent; color: var(--ink); font-family: inherit; font-size: 18px; line-height: 1.6;">ได้ลำไยจากสวนมาเต็มท้ายรถ ใครอยากได้ทักมาเลยนะ แบ่งกันกินฟรี</textarea>
      </div>
    </div>

    <div style="margin: 8px 0 0 52px; position: relative; border-radius: 16px; overflow: hidden; border: 1px solid var(--line); background: var(--chip);">
      <div role="img" aria-label="ตัวอย่างรูปที่แนบ: ลำไยในตะกร้า" style="height: 200px; background: linear-gradient(135deg, #C9A66B 0%, #8C6A3A 55%, #5E7F4A 100%);"></div>
      <button type="button" aria-label="เอารูปออก" style="position: absolute; top: 8px; right: 8px; width: 44px; height: 44px; border: 0; border-radius: 22px; background: rgba(0,0,0,0.6); color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg>
      </button>
      <p style="margin: 0; padding: 8px 12px; font-size: 14px; color: var(--sub);">longan.jpg · 3.2 MB จะถูกย่อให้อัตโนมัติ</p>
    </div>
  </form>

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 8px 12px 24px 20px; border-top: 1px solid var(--line); background: var(--card);">
    <div style="display: flex; gap: 4px;">
      <button type="button" aria-label="แนบรูป" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: var(--brandsoft); color: var(--brand); display: flex; align-items: center; justify-content: center; cursor: pointer;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="3"></rect><circle cx="9" cy="10" r="1.6"></circle><path d="M4 17l5-4.5 4 3.5 3-2.5 4 3.5"></path></svg>
      </button>
    </div>
    <p style="margin: 0; padding-right: 8px; font-size: 14px; font-weight: 500; color: var(--sub);">{{count}} / 280</p>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      count: 61,
      onBrand: '#FFFFFF'
    };
  }
}
</script>
</body>
</html>
