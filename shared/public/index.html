<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mooban</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<a class="skip-link" href="#main">ข้ามไปที่เนื้อหา</a>

<svg class="sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11l8-6.5 8 6.5v8a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"/></symbol>
  <symbol id="i-gallery" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M4 17l5-4.5 4 3.5 3-2.5 4 3.5"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c.8-3.6 3.5-5.5 7-5.5s6.2 1.9 7 5.5"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><path d="M5 19V11 M12 19V5 M19 19v-6"/></symbol>
  <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></symbol>
  <symbol id="i-comment" viewBox="0 0 24 24"><path d="M5 5h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H11l-5 3.5V17H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-prev" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12 M18 6L6 18"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
</svg>

<header class="topbar">
  <button class="icon-btn topbar__back" type="button" aria-label="ย้อนกลับ" data-back>
    <svg width="22" height="22" aria-hidden="true"><use href="#i-back"/></svg>
  </button>
  <p class="wordmark">Mooban</p>
  <a class="icon-btn topbar__gallery" href="/gallery" aria-label="แกลเลอรีรูป">
    <svg width="22" height="22" aria-hidden="true"><use href="#i-gallery"/></svg>
  </a>
</header>

<nav class="sidenav" aria-label="เมนูหลัก">
  <p class="wordmark wordmark--lg">Mooban</p>
  <a href="/" data-nav="feed"><svg width="22" height="22" aria-hidden="true"><use href="#i-home"/></svg>ฟีด</a>
  <a href="/gallery" data-nav="gallery"><svg width="22" height="22" aria-hidden="true"><use href="#i-gallery"/></svg>แกลเลอรี</a>
  <a href="/" data-nav="profile" data-requires-user><svg width="22" height="22" aria-hidden="true"><use href="#i-user"/></svg>โปรไฟล์</a>
  <a href="/test" data-nav="test"><svg width="22" height="22" aria-hidden="true"><use href="#i-chart"/></svg>ทดสอบระบบ</a>
  <a class="btn btn--primary sidenav__post" href="/" data-testid="new-post">โพสต์ใหม่</a>
</nav>

<main id="main" tabindex="-1"></main>

<aside class="rail" aria-label="ข้างเคียง"></aside>

<nav class="bottomnav" aria-label="เมนูหลัก">
  <a href="/" data-nav="feed"><svg width="22" height="22" aria-hidden="true"><use href="#i-home"/></svg><span>ฟีด</span></a>
  <a href="/gallery" data-nav="gallery"><svg width="22" height="22" aria-hidden="true"><use href="#i-gallery"/></svg><span>แกลเลอรี</span></a>
  <a href="/" data-nav="profile" data-requires-user><svg width="22" height="22" aria-hidden="true"><use href="#i-user"/></svg><span>โปรไฟล์</span></a>
</nav>

<div id="route-announcer" class="sr-only" role="status" aria-live="polite"></div>

<script type="module" src="/app.js"></script>
</body>
</html>
