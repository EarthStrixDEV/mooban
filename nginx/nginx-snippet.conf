# Mooban - Nginx + PHP-FPM routing snippet (Spec section 9).
#
# Paste this into the domain's custom Nginx config (it must sit at `server {}`
# level). The PHP code is the same as the Apache version; Nginx does not read
# .htaccess, so everything .htaccess does is done here.
#
#   * document root = the folder that holds index.html, api.php and media/
#   * EDIT the single `fastcgi_pass` line below to point at your PHP-FPM
#     (unix socket or host:port).  fastcgi_pass cannot be inherited, so it has
#     to live inside `location = /api.php`.
#   * `add_header` is not inherited into a location that has its own
#     add_header, so every location below repeats the headers it needs.
#   * X-Robots-Tag is NOT added to PHP responses: PHP already sends it.
#
# Do not enable gzip for text/event-stream (/api/stream). gzip_types below
# leaves it out on purpose - keep it that way.

client_max_body_size 12m;

# --- compression (never text/event-stream) -----------------------------------
gzip on;
gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

# --- oversize body: answer in the same JSON the app uses ---------------------
error_page 413 = @mb_payload_too_large;
location @mb_payload_too_large {
    default_type application/json;
    add_header X-Robots-Tag "noindex" always;
    return 413 '{"error":"payload_too_large"}';
}

# --- web app (SPA): real files are served, anything else gets index.html ----
location / {
    add_header X-Robots-Tag "noindex" always;
    try_files $uri /index.html;
}

# index.html, also reached through the rewrites above (/gallery, /u/x, /test ...)
location = /index.html {
    add_header X-Robots-Tag "noindex" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:" always;
    add_header X-Content-Type-Options "nosniff" always;
}

# --- API and test tools -> api.php (same effect as the .htaccess rewrite) ----
location ~ ^/(api|download|upload|cache)(/|$) {
    rewrite ^ /api.php last;
}

# The only PHP file that may run. `internal` = reachable only through the
# rewrite above, never by a client asking for /api.php directly.
# api.php reads REQUEST_URI, so it must be the client's original URI
# ($request_uri), not /api.php.
location = /api.php {
    internal;

    fastcgi_pass unix:/run/php-fpm/mooban.sock;   # <-- EDIT: your PHP-FPM

    # SSE: do not hold events back, allow 60 s streams (+ margin)
    fastcgi_buffering off;
    fastcgi_read_timeout 75s;
    # Nginx swallows X-Accel-Buffering by default; the app sends it, so let it through.
    fastcgi_pass_header X-Accel-Buffering;

    # gzip turns an ETag into a weak one (W/"..."). The cache test endpoint
    # needs its strong validator, so it is the one URL that is not compressed.
    if ($request_uri ~ ^/cache/static(\?|$)) {
        gzip off;
    }

    fastcgi_param SCRIPT_FILENAME  $document_root/api.php;
    fastcgi_param SCRIPT_NAME      /api.php;
    fastcgi_param REQUEST_URI      $request_uri;
    fastcgi_param DOCUMENT_URI     $document_uri;
    fastcgi_param DOCUMENT_ROOT    $document_root;
    fastcgi_param QUERY_STRING     $query_string;
    fastcgi_param REQUEST_METHOD   $request_method;
    fastcgi_param CONTENT_TYPE     $content_type;
    fastcgi_param CONTENT_LENGTH   $content_length;
    fastcgi_param SERVER_PROTOCOL  $server_protocol;
    fastcgi_param REQUEST_SCHEME   $scheme;
    fastcgi_param HTTPS            $https if_not_empty;
    fastcgi_param GATEWAY_INTERFACE CGI/1.1;
    fastcgi_param SERVER_SOFTWARE  nginx/$nginx_version;
    fastcgi_param REMOTE_ADDR      $remote_addr;
    fastcgi_param REMOTE_PORT      $remote_port;
    fastcgi_param SERVER_ADDR      $server_addr;
    fastcgi_param SERVER_PORT      $server_port;
    fastcgi_param SERVER_NAME      $server_name;
    fastcgi_param REDIRECT_STATUS  200;
    # (Authorization and every other request header reach PHP as HTTP_*.)
}

# --- uploaded images: immutable, 304-capable, never executable ---------------
# ETag / Last-Modified come from Nginx by default, so If-None-Match and
# If-Modified-Since give 304. ^~ keeps the regex locations below out of /media.
location ^~ /media/ {
    autoindex off;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex" always;

    location ~* \.(php|phtml|phar)$ {
        add_header X-Robots-Tag "noindex" always;
        return 403;
    }
}

# --- never serve or run any other PHP file or dotfile ------------------------
location ~* \.(php|phtml|phar)$ {
    add_header X-Robots-Tag "noindex" always;
    return 404;
}
location ~ /\. {
    add_header X-Robots-Tag "noindex" always;
    return 404;
}
