name: mooban

services:
  mysql:
    image: mysql:8.0
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - ./mysql-init.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
      - ../shared/schema.sql:/schema.sql:ro
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"]
      interval: 3s
      timeout: 3s
      retries: 40

  apache:
    build:
      context: .
      dockerfile: php-apache.Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8081:80"
    volumes:
      - ../build/php:/var/www/site
    # best-effort: bind mounts may keep host ownership
    command: sh -c "mkdir -p /var/www/site/public_html/media && chown www-data:www-data /var/www/site/public_html/media || true; exec apache2-foreground"

  phpfpm:
    build:
      context: .
      dockerfile: php-fpm.Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ../build/php-nginx:/var/www/site
      - fpm-sock:/run/php-fpm
    # best-effort: bind mounts may keep host ownership
    command: sh -c "mkdir -p /var/www/site/public_html/media && chown www-data:www-data /var/www/site/public_html/media || true; exec php-fpm"

  nginx:
    image: nginx:1.27
    depends_on:
      - phpfpm
    ports:
      - "8082:80"
    volumes:
      - ../build/php-nginx:/var/www/site
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../nginx/nginx-snippet.conf:/etc/nginx/mooban/nginx-snippet.conf:ro
      - fpm-sock:/run/php-fpm

  node:
    build:
      context: ../node
      dockerfile: ../dev/node.Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8083:8083"
    volumes:
      - ../node:/app/node:ro
      - ../shared:/app/shared:ro
      - node-media:/data/media
      - node-cache:/data/cache
    environment:
      DB_HOST: mysql
      DB_NAME: mb_node
      DB_USER: mb
      DB_PASS: mb
      APP_STACK: node
      PORT: "8083"
      TEST_TOKEN: dev-test-token-0123456789abcd
      PUBLIC_DIR: /app/shared/public
      MEDIA_DIR: /data/media
      CACHE_DIR: /data/cache
    command: ["node", "app.js"]

volumes:
  mysql-data:
  fpm-sock:
  node-media:
  node-cache:
